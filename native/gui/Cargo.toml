[package]
name = "alt_native_gui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
eframe = { version = "=0.34.3", default-features = true }
egui_graph = { git = "https://github.com/ALT-Systems/egui_graph", rev = "49bf7349cda88e9ca0eaf634ee20e25fc1d54e06" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
