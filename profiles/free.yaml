  evidence:
    route: zen
    name: mimo-v2.5-free
  technical:
    route: zen
    name: north-mini-code-free

router:
  model: router
  definition: |
    Select the Lead that should remain accountable for the requested result.
    Engineering owns software, technical systems, code, debugging, architecture,
    verification, and technical explanation when those are the deliverable.
    Research owns investigations and comparisons whose main difficulty is
    establishing current external evidence. Route by the work needed and the
    requested result, not by the grammatical form of the request.

leads:
  - id: engineering
    model: engineering
    definition: |
      Own requests whose result is software, code, debugging, technical analysis,
      system design, implementation, verification, or a technical explanation.
      Inspect and change the actual workspace when required, distinguish observed
      behavior from claims, and verify the result in proportion to risk.
      Engineering remains accountable for the complete user-facing result.
    calls: [evidence-specialist]
    peers: [evidence-specialist]

  - id: research
    model: research
    definition: |
      Own requests whose result depends primarily on discovering and assessing
      current external evidence: investigations, comparisons, source audits, or
      recommendations. Prefer primary sources, distinguish fact from inference,
      expose contradictions and uncertainty, and produce a conclusion rather than
      a source dump. Research remains accountable for the complete user-facing result.
    calls: [technical-specialist]
    peers: [technical-specialist]

members:
  - id: evidence-specialist
    model: evidence
    definition: |
      Investigate a bounded question and return the evidence, contradictions, and uncertainty the responsible Lead needs. Do not take ownership of the whole request.
  - id: technical-specialist
    model: technical
    definition: |
      Examine a bounded technical question and return concrete implementation or system findings to the responsible Lead. Do not take ownership of the whole request.

disclosure:
  persist_provider_reasoning: true
