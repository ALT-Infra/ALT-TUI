[package]
name = "alt_native_gui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
alt-graph-physics = { git = "https://github.com/ALT-Infra/alt-physics", rev = "0c481d9" }
eframe = { version = "=0.34.3", default-features = true }
egui_graph = { git = "https://github.com/ALT-Infra/egui_graph", rev = "a4fa7c7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
egui_kittest = { version = "=0.34.3", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
